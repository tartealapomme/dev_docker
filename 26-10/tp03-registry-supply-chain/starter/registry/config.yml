version: 0.1
log:
  fields:
    service: registry
storage:
  filesystem:
    rootdirectory: /var/lib/registry
  delete:
    enabled: true
http:
  addr: :5000
  secret: shop-sas-local-http-secret
  tls:
    certificate: /certs/registry.local.crt
    key: /certs/registry.local.key
auth:
  htpasswd:
    realm: Shop SAS Registry
    path: /auth/htpasswd
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
