name: shop-registry

services:
  registry:
    image: registry:2.8.3
    container_name: shop-registry
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./config.yml:/etc/docker/registry/config.yml:ro
      - ./certs:/certs:ro
      - ./auth:/auth:ro
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -S --spider --no-check-certificate https://127.0.0.1:5000/v2/ 2>&1 | grep -q 401"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ui:
    image: joxit/docker-registry-ui:2.5.7
    container_name: shop-registry-ui
    restart: unless-stopped
    ports:
      - "5080:80"
    environment:
      REGISTRY_TITLE: Shop SAS
      NGINX_PROXY_PASS_URL: https://registry:5000
      DELETE_IMAGES: "true"
      REGISTRY_SECURED: "false"
      SINGLE_REGISTRY: "true"
    depends_on:
      registry:
        condition: service_healthy

  mirror:
    image: registry:2.8.3
    container_name: shop-registry-mirror
    restart: unless-stopped
    ports:
      - "5001:5000"
    volumes:
      - ./mirror-config.yml:/etc/docker/registry/config.yml:ro
      - mirror-data:/var/lib/registry
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5000/v2/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  registry-data:
    name: shop-registry-data
  mirror-data:
    name: shop-registry-mirror-data
