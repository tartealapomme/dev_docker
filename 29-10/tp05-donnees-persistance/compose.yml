name: shoplab

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - back
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  back:
    name: shoplab_back

volumes:
  pgdata:
    name: shoplab_pgdata
