name: shopinit

services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/010-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

secrets:
  db_password:
    file: ./secrets/db_password.txt

volumes:
  pgdata:
    name: shopinit_pgdata
