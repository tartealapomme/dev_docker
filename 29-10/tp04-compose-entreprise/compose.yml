name: shop

x-healthcheck-defaults: &healthcheck-defaults
  interval: 5s
  timeout: 5s
  retries: 12
  start_period: 20s

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    logging: *logging
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=shop_front
      - --entrypoints.web.address=:80
      - --ping=true
      - --accesslog=true
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - front
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "traefik", "healthcheck", "--ping"]

  api:
    build:
      context: ../../26-10/tp01-optimisation-image/starter/shopapi
      dockerfile: Dockerfile
    image: shopapi:local
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
    secrets:
      - db_password
    volumes:
      - ./scripts/with-database-url.sh:/with-database-url.sh:ro
    entrypoint: ["/bin/sh", "/with-database-url.sh"]
    command: ["node", "src/server.js"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - front
      - back
    labels:
      - traefik.enable=true
      - traefik.docker.network=shop_front
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=3000
      - traefik.http.services.api.loadbalancer.healthcheck.path=/health
      - traefik.http.services.api.loadbalancer.healthcheck.interval=5s
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]

  worker:
    build:
      context: ../../26-10/tp02-buildkit-avance/starter/shop-worker
      dockerfile: Dockerfile
      secrets:
        - pipconf
    image: shop-worker:local
    restart: unless-stopped
    logging: *logging
    environment:
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: INFO
      PYTHONPATH: /app
    secrets:
      - db_password
    volumes:
      - ./scripts/with-database-url.sh:/with-database-url.sh:ro
    entrypoint: ["/bin/sh", "/with-database-url.sh"]
    command: ["python", "-m", "worker.main"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/metrics')"]

  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: shop
      POSTGRES_DB: shop
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    networks:
      - back
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "redis-cli", "ping"]

  adminer:
    image: adminer:4.8.1
    profiles: ["tools"]
    restart: unless-stopped
    logging: *logging
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - front
      - back
    labels:
      - traefik.enable=true
      - traefik.docker.network=shop_front
      - traefik.http.routers.adminer.rule=Host(`adminer.localhost`)
      - traefik.http.routers.adminer.entrypoints=web
      - traefik.http.services.adminer.loadbalancer.server.port=8080
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080"]

  migrate:
    image: postgres:16.4-alpine
    profiles: ["ops"]
    restart: "no"
    logging: *logging
    environment:
      MIGRATION: ${MIGRATION:-002-add-sku.sql}
    secrets:
      - db_password
    volumes:
      - ./db:/migrations:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pw=$$(cat /run/secrets/db_password)
        psql "postgresql://shop:$${pw}@db:5432/shop" -f "/migrations/$${MIGRATION}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - back

secrets:
  db_password:
    file: ./secrets/db_password.txt
  pipconf:
    file: ../../26-10/tp02-buildkit-avance/starter/shop-worker/pip.conf

networks:
  front:
    name: shop_front
  back:
    name: shop_back
    internal: true

volumes:
  pgdata:
    name: shop_pgdata
  redisdata:
    name: shop_redisdata
