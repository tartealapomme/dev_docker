services:
  api:
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit être défini}/shopapi:${VERSION:?VERSION doit être défini}
    ports: !reset []
    volumes: !override
      - ./scripts/with-database-url.sh:/with-database-url.sh:ro
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    build: !reset null
    image: ${REGISTRY:?REGISTRY doit être défini}/shop-worker:${VERSION:?VERSION doit être défini}
    volumes: !override
      - ./scripts/with-database-url.sh:/with-database-url.sh:ro
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  db:
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  redis:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  traefik:
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
