<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercice 03</title>
  <style>
    :root {
      --bg: #0f172a;
      --fg: #e2e8f0;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--fg);
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    main {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin-bottom: 0.75rem;
      color: var(--accent);
    }
    p { opacity: 0.85; font-size: 1.1rem; }
  </style>
</head>
<body>
  <main>
    <h1>Exercice 03</h1>
    <p>Hello World — site personnalisé servi par NGINX dans Docker</p>
  </main>
</body>
</html>
