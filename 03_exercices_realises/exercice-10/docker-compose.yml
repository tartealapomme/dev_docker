services:
  db:
    image: postgres:16-alpine
    container_name: ex10-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    networks:
      - notes-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: ex10-notes-app
    container_name: ex10-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: ${APP_NAME}
      APP_VERSION: ${APP_VERSION}
      APP_ENV: ${APP_ENV}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      UPLOAD_PATH: ${UPLOAD_PATH}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      LOG_LEVEL: ${LOG_LEVEL}
      SHOW_SQL: ${SHOW_SQL}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notes-net

volumes:
  pg_data:
  uploads:

networks:
  notes-net:
    name: ex10-net
