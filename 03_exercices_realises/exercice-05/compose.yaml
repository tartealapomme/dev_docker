services:
  mysql:
    image: mysql:8.0
    container_name: ex05-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: exercice05
      MYSQL_USER: ynov
      MYSQL_PASSWORD: ynovpass
    volumes:
      - ex05-mysql-data:/var/lib/mysql
    networks:
      - ex05-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: ex05-adminer
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - ex05-net
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  ex05-mysql-data:

networks:
  ex05-net:
    name: ex05-net
