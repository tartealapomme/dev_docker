name: gestion-interne

services:
  nginx:
    image: nginx:1.27.5-alpine
    container_name: gestion-interne-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Host: localhost:8080", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - proxy
      - app

  wordpress:
    image: wordpress:6.8.3-apache
    container_name: gestion-interne-wordpress
    restart: unless-stopped
    environment:
      WORDPRESS_DB_HOST: mariadb
      WORDPRESS_DB_USER: ${MARIADB_USER}
      WORDPRESS_DB_PASSWORD_FILE: /run/secrets/mariadb_password
      WORDPRESS_DB_NAME: ${MARIADB_DATABASE}
    secrets:
      - mariadb_password
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: localhost:8080", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - wordpress-data:/var/www/html
    networks:
      - app
      - data

  mariadb:
    image: mariadb:11.8.3
    container_name: gestion-interne-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
    secrets:
      - mariadb_root_password
      - mariadb_password
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - data

volumes:
  wordpress-data:
    name: gestion-interne-wordpress-data
  mariadb-data:
    name: gestion-interne-mariadb-data

networks:
  proxy:
    name: gestion-interne-proxy
  app:
    name: gestion-interne-app
  data:
    name: gestion-interne-data

secrets:
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt
  mariadb_password:
    file: ./secrets/mariadb_password.txt
